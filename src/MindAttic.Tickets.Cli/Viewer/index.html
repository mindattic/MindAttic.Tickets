<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tickets</title>
<!-- Generated by `tickets view` (MindAttic.Tickets). A read-only snapshot: the tickets CLI is the only writer. -->
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
    --accent: #2f5fd0; --open: #b25e00; --closed: #2e7d32; --wont: #8a8a85; --row: #fafaf8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --panel: #1f1f1e; --text: #e8e8e4; --muted: #9a9a94; --line: #33332f;
      --accent: #7aa2ff; --open: #f0a64a; --closed: #6cc070; --wont: #7d7d78; --row: #232322;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  h1 { font-size: 16px; margin: 0 12px 0 0; }
  .muted { color: var(--muted); }
  select, input, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  input[type=search] { flex: 1 1 220px; min-width: 0; }
  button { cursor: pointer; }
  .tabs button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 12px 16px 40px; }
  .counts { margin: 4px 0 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; vertical-align: top; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  tr:nth-child(even) td { background: var(--row); }
  td.id, td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .s-open { color: var(--open); font-weight: 600; }
  .s-closed { color: var(--closed); }
  .s-wont-do { color: var(--wont); }
  .ref, .evidence { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .name { font-weight: 600; }
  h2 { font-size: 14px; margin: 18px 0 6px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 640px) { td.date, th.date, td.type, th.type { display: none; } }
  .graph { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .canvas { flex: 1 1 520px; min-width: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; max-height: 75vh; }
  .canvas svg { display: block; }
  .node { cursor: pointer; }
  .node rect { fill: var(--panel); stroke-width: 2.5; }
  .node.focus rect { stroke-width: 5; }
  .node.closed rect { stroke-dasharray: 5 3; }
  .node text { fill: var(--text); font-size: 12px; }
  .node .badge { fill: var(--muted); font-size: 11px; }
  .node .toggle { fill: var(--accent); font-weight: 700; }
  .edge { stroke: var(--muted); fill: none; stroke-width: 1.5; }
  .edge.part-of { stroke-width: 3.5; }
  .edge.related { stroke-dasharray: 6 4; }
  .edge.other { stroke-dasharray: 2 3; }
  .info { flex: 0 1 320px; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .info h3 { margin: 0 0 4px; font-size: 14px; }
  .info button { margin: 2px 4px 2px 0; }
  .legend { margin: 6px 0; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Tickets</h1>
    <span class="tabs">
      <button type="button" data-tab="tickets" aria-pressed="true">Tickets</button>
      <button type="button" data-tab="stories" aria-pressed="false">Stories</button>
      <button type="button" data-tab="graph" aria-pressed="false">Graph</button>
    </span>
    <select id="repo" aria-label="Repo"><option value="">All repos</option></select>
    <select id="status" aria-label="Status"></select>
    <select id="type" aria-label="Type"></select>
    <input id="q" type="search" placeholder="Filter text, ID or ref" aria-label="Filter">
    <span id="graphbar" hidden>
      <input id="focus" list="ids" placeholder="Focus ticket ID" aria-label="Focus ticket" size="14">
      <datalist id="ids"></datalist>
      <select id="hops" aria-label="Hops"><option value="1">1 hop</option><option value="2" selected>2 hops</option><option value="3">3 hops</option><option value="4">4 hops</option></select>
      <select id="kind" aria-label="Link kind"><option value="">Every kind</option><option value="requires">requires</option><option value="part-of">part-of</option><option value="related">related</option><option value="other">other kinds</option></select>
    </span>
    <button type="button" id="reload" title="Re-read the snapshot (run 'tickets view' to refresh it)">Reload</button>
  </div>
  <div class="muted" id="generated"></div>
</header>
<main>
  <div class="counts muted" id="counts"></div>
  <div id="out"></div>
</main>
<script src="data.js"></script>
<script>
(() => {
  const data = window.TICKETS;
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  if (!data) { $("out").append(el("div", "empty", "No data.js next to this page; run 'tickets view'.")); return; }

  let tab = "tickets";
  $("generated").textContent = `Snapshot of the ticket database, ${data.generated}. Read-only: change tickets and stories with the tickets CLI.`;
  for (const r of data.repos) $("repo").append(new Option(`${r.name} (${r.code})`, r.name));
  if (data.selectedRepo) $("repo").value = data.repos.find(r => r.name.toLowerCase() === data.selectedRepo.toLowerCase())?.name ?? "";

  const options = (select, values) => {
    const keep = select.value;
    select.replaceChildren(...values.map(([v, label]) => new Option(label, v)));
    select.value = values.some(([v]) => v === keep) ? keep : values[0][0];
  };
  const setFilters = () => {
    if (tab === "tickets" || tab === "graph") {
      options($("status"), [["", "Any status"], ["open", "Open"], ["closed", "Closed"], ["wont-do", "Won't do"]]);
      options($("type"), [["", "Any type"], ...["feature", "fix", "chore", "docs", "interview"].map(t => [t, t])]);
      $("type").hidden = false;
    } else {
      options($("status"), [["", "Any status"], ["done", "✅ Done"], ["partial", "🟡 Partial"], ["planned", "⬜ Planned"]]);
      $("type").hidden = true;
    }
  };

  const matches = (item, fields) => {
    const q = $("q").value.trim().toLowerCase();
    return (!$("repo").value || item.repo === $("repo").value)
      && (!q || fields.some(f => (item[f] ?? "").toLowerCase().includes(q)));
  };

  const table = (heads, rows) => {
    if (rows.length === 0) return el("div", "empty", "Nothing matches.");
    const t = el("table"), head = el("tr");
    for (const [h, cls] of heads) head.append(el("th", cls, h));
    t.append(el("thead"), el("tbody"));
    t.tHead.append(head);
    t.tBodies[0].append(...rows);
    return t;
  };

  const tickets = () => {
    const status = $("status").value, type = $("type").value;
    const order = { open: 0, closed: 1, "wont-do": 2 };
    const list = data.tickets
      .filter(t => (!status || t.status === status) && (!type || t.type === type) && matches(t, ["id", "name", "summary", "ref"]))
      .sort((a, b) => (order[a.status] ?? 3) - (order[b.status] ?? 3) || b.date.localeCompare(a.date) || a.id.localeCompare(b.id, undefined, { numeric: true }));
    const open = list.filter(t => t.status === "open").length;
    $("counts").textContent = `${list.length} ticket${list.length === 1 ? "" : "s"}, ${open} open`;
    return table([["ID", "id"], ["Date", "date"], ["Type", "type"], ["Status", ""], ["Name · summary", ""]], list.map(t => {
      // The friendly name (M.TIX-T313) leads; the summary follows under it (or alone while it has none).
      const tr = el("tr"), summary = el("td");
      if (t.name) summary.append(el("div", "name", t.name), el("div", "ref", t.summary)); else summary.append(t.summary);
      if (t.ref && t.ref !== "—") summary.append(el("div", "ref", t.ref));
      tr.append(el("td", "id", t.id), el("td", "date", t.date), el("td", "type", t.type), el("td", "s-" + t.status, t.status), summary);
      return tr;
    }));
  };

  const stories = () => {
    const status = $("status").value;
    const list = data.stories.filter(s => s.status && (!status || s.status === status) && matches(s, ["id", "text", "evidence", "epic"]));
    const glyphs = { done: "✅", partial: "🟡", planned: "⬜" };
    const count = k => list.filter(s => s.status === k).length;
    $("counts").textContent = `${list.length} stor${list.length === 1 ? "y" : "ies"}: ${count("done")} ✅ · ${count("partial")} 🟡 · ${count("planned")} ⬜`;
    if (list.length === 0) return el("div", "empty", "Nothing matches.");
    const out = document.createDocumentFragment();
    const groups = new Map();
    for (const s of list) {
      const key = `${s.repo} — ${s.epic ?? "Stories"}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(s);
    }
    for (const [key, items] of groups) {
      out.append(el("h2", "", key), table([["ID", "id"], ["", ""], ["Story", ""]], items.map(s => {
        const tr = el("tr"), text = el("td", "", s.text);
        if (s.evidence) text.append(el("div", "evidence", s.evidence));
        tr.append(el("td", "id", s.id), el("td", "", s.glyph ?? glyphs[s.status] ?? ""), text);
        return tr;
      })));
    }
    return out;
  };

  // ── Graph (M.TIX-T315): a ticket's neighbourhood N hops out, part-of trees drawn as rows, the rest force-directed ──
  const byId = new Map(data.tickets.map(t => [t.id.toUpperCase(), t]));
  const links = data.links ?? [];
  const collapsed = new Set();
  let focus = null;
  for (const t of data.tickets) $("ids").append(new Option(t.name ? `${t.id} · ${t.name}` : t.id, t.id));
  const caption = t => t ? (t.name ? `${t.id} · ${t.name}` : `${t.id} · ${t.summary.length > 40 ? t.summary.slice(0, 39) + "…" : t.summary}`) : "";
  const nodeOf = id => byId.get(id.toUpperCase()) ?? { id, summary: "", status: null, repo: null, weight: 0 };
  const kindOk = l => { const k = $("kind").value; return !k || (k === "other" ? !["requires", "part-of", "related"].includes(l.kind) : l.kind === k); };
  const hash = s => { let h = 2166136261; for (const c of s.toUpperCase()) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; };
  const size = w => Math.min(76, 30 + 7 * Math.log2(1 + Math.max(0, w || 0)));

  const neighbourhood = () => {
    const hops = +$("hops").value, start = focus.toUpperCase();
    const status = $("status").value, repo = $("repo").value;
    const keep = id => { if (id === start) return true; const t = byId.get(id); return (!status || t?.status === status) && (!repo || t?.repo === repo); };
    // A collapsed node hides everything part of it, at any depth.
    const hidden = new Set();
    for (const c of collapsed) { const q = [c]; while (q.length) { const x = q.shift(); for (const l of links) if (l.kind === "part-of" && l.to.toUpperCase() === x && !hidden.has(l.from.toUpperCase())) { hidden.add(l.from.toUpperCase()); q.push(l.from.toUpperCase()); } } }
    const depth = new Map([[start, 0]]), q = [start];
    while (q.length) {
      const x = q.shift();
      if (depth.get(x) >= hops) continue;
      for (const l of links) {
        if (!kindOk(l)) continue;
        const [f, t] = [l.from.toUpperCase(), l.to.toUpperCase()];
        const y = f === x ? t : t === x ? f : null;
        if (y && !depth.has(y) && !hidden.has(y) && keep(y)) { depth.set(y, depth.get(x) + 1); q.push(y); }
      }
    }
    const ids = [...depth.keys()];
    const edges = links.filter(l => kindOk(l) && depth.has(l.from.toUpperCase()) && depth.has(l.to.toUpperCase()));
    return { ids, edges };
  };

  const layout = (ids, edges) => {
    const pos = new Map(), ROW = 120, COL = 210, M = 80;
    const part = edges.filter(e => e.kind === "part-of").map(e => [e.from.toUpperCase(), e.to.toUpperCase()]);
    const tree = new Set(part.flat()), depth = new Map([...tree].map(id => [id, 0]));
    for (let pass = 0; pass < tree.size; pass++) {
      let moved = false;
      for (const [c, p] of part) if (depth.get(c) < depth.get(p) + 1 && depth.get(p) + 1 <= tree.size) { depth.set(c, depth.get(p) + 1); moved = true; }
      if (!moved) break;
    }
    const rows = [];
    for (const [id, d] of depth) (rows[d] ??= []).push(id);
    const place = new Map();
    for (const row of rows.filter(Boolean)) {
      const mean = id => { const ps = part.filter(([c]) => c === id).map(([, p]) => place.get(p)).filter(v => v != null); return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : Infinity; };
      row.sort((a, b) => mean(a) - mean(b) || a.localeCompare(b, undefined, { numeric: true })).forEach((id, i) => place.set(id, i));
    }
    const widest = Math.max(0, ...rows.filter(Boolean).map(r => r.length));
    for (const row of rows.filter(Boolean)) for (const id of row) pos.set(id, { x: M + (place.get(id) + (widest - row.length) / 2) * COL, y: M + depth.get(id) * ROW });
    const free = ids.filter(id => !tree.has(id));
    if (free.length) {
      const side = Math.max(1, Math.ceil(Math.sqrt(free.length))), left = M + widest * COL + (tree.size ? COL : 0), box = side * COL, k = COL * 0.9;
      for (const id of free) { const h = hash(id); pos.set(id, { x: left + (h % 10000) / 10000 * box, y: M + (Math.floor(h / 10000) % 10000) / 10000 * box }); }
      for (let step = 0; step < 150; step++) {
        const temp = k * (1 - step / 150) * 0.5 + 1, push = new Map(free.map(id => [id, { x: 0, y: 0 }]));
        for (const a of free) for (const b of ids) {
          if (a === b) continue;
          const dx = pos.get(a).x - pos.get(b).x, dy = pos.get(a).y - pos.get(b).y, d = Math.max(1, Math.hypot(dx, dy)), f = k * k / d;
          push.get(a).x += dx / d * f; push.get(a).y += dy / d * f;
        }
        for (const e of edges) {
          const [a, b] = [e.from.toUpperCase(), e.to.toUpperCase()];
          const dx = pos.get(a).x - pos.get(b).x, dy = pos.get(a).y - pos.get(b).y, d = Math.max(1, Math.hypot(dx, dy)), f = d * d / k;
          if (push.has(a)) { push.get(a).x -= dx / d * f; push.get(a).y -= dy / d * f; }
          if (push.has(b)) { push.get(b).x += dx / d * f; push.get(b).y += dy / d * f; }
        }
        for (const id of free) { const p = push.get(id), len = Math.max(1, Math.hypot(p.x, p.y)), mv = Math.min(len, temp); pos.get(id).x += p.x / len * mv; pos.get(id).y += p.y / len * mv; }
      }
    }
    const minX = Math.min(...[...pos.values()].map(p => p.x)), minY = Math.min(...[...pos.values()].map(p => p.y));
    for (const p of pos.values()) { p.x += M - minX; p.y += M - minY; }
    return pos;
  };

  const svg = (tag, attrs, text) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; return e; };

  const info = () => {
    const t = nodeOf(focus), box = el("div", "info");
    box.append(el("h3", "", caption(t) || focus));
    if (t.status) box.append(el("div", "muted", `${t.repo} · ${t.type} · ${t.status}` + (t.weight ? ` · weight ${t.weight}: ${t.why}` : "")), el("p", "", t.summary));
    const rel = [];
    for (const l of links) {
      const [f, to] = [l.from.toUpperCase(), l.to.toUpperCase()], me = focus.toUpperCase();
      const inv = { "requires": "required-by", "part-of": "parent-of", "related": "related", "follow-up-of": "followed-up-by", "supersedes": "superseded-by", "duplicates": "duplicated-by", "implements": "implemented-by" };
      if (f === me) rel.push([l.kind === "part-of" ? "parent" : l.kind, l.to]); else if (to === me) rel.push([l.kind === "part-of" ? "child" : inv[l.kind] ?? l.kind, l.from]);
    }
    for (const [role, id] of rel.sort((a, b) => a[0].localeCompare(b[0]))) {
      const b = el("button", "", `${role}: ${caption(nodeOf(id)) || id}`); b.type = "button";
      b.addEventListener("click", () => { focus = id; $("focus").value = id; render(); });
      box.append(el("div", "", ""), b);
    }
    return box;
  };

  const graph = () => {
    const wrap = el("div", "graph");
    if (!focus) { const heaviest = [...data.tickets].filter(t => t.status === "open").sort((a, b) => (b.weight || 0) - (a.weight || 0))[0]; focus = heaviest?.id ?? data.tickets[0]?.id; $("focus").value = focus ?? ""; }
    if (!focus) return el("div", "empty", "No tickets.");
    const { ids, edges } = neighbourhood(), pos = layout(ids, edges);
    $("counts").textContent = `${ids.length} ticket${ids.length === 1 ? "" : "s"} within ${$("hops").value} hop(s) of ${focus}, ${edges.length} link${edges.length === 1 ? "" : "s"}. Click a ticket to focus it; ± collapses its children.`;
    const W = Math.max(...[...pos.values()].map(p => p.x)) + 200, H = Math.max(...[...pos.values()].map(p => p.y)) + 90;
    const s = svg("svg", { width: W, height: H, role: "img", "aria-label": `Graph of ${focus} and its neighbours; the list below reads the same` });
    const defs = svg("defs", {}); const marker = svg("marker", { id: "arrow", viewBox: "0 0 10 10", refX: 10, refY: 5, markerWidth: 8, markerHeight: 8, orient: "auto-start-reverse" });
    marker.append(svg("path", { d: "M0,0 L10,5 L0,10 z", fill: "#8a8a85" })); defs.append(marker); s.append(defs);
    for (const e of edges) {
      const a = pos.get(e.from.toUpperCase()), b = pos.get(e.to.toUpperCase());
      const cls = ["requires", "part-of", "related"].includes(e.kind) ? e.kind : "other";
      // part-of is drawn parent → child (a tree), requires from the waiting ticket to what it waits for.
      const [p, q] = e.kind === "part-of" ? [b, a] : [a, b];
      const line = svg("line", { x1: p.x, y1: p.y, x2: q.x, y2: q.y, class: `edge ${cls}` });
      if (cls === "requires" || cls === "other") line.setAttribute("marker-end", "url(#arrow)");
      line.append(svg("title", {}, `${e.from} ${e.kind} ${e.to}`));
      s.append(line);
    }
    for (const id of ids) {
      const t = nodeOf(id), p = pos.get(id), w = size(t.weight), width = 150 + w, height = w;
      const g = svg("g", { class: `node ${t.status ?? "unknown"}${id === focus.toUpperCase() ? " focus" : ""}`, transform: `translate(${p.x - width / 2},${p.y - height / 2})`, tabindex: 0, role: "button", "aria-label": `${caption(t) || id}, ${t.status ?? "not a ticket"}: focus it` });
      g.append(svg("rect", { width, height, rx: 8, stroke: (data.colours ?? {})[t.repo] ?? "#9E9E9E" }));
      g.append(svg("text", { x: 8, y: 16 }, (caption(t) || id).slice(0, 34)));
      g.append(svg("text", { x: 8, y: height - 6, class: "badge" }, `${t.status === "open" ? "●" : t.status === "closed" ? "✓" : t.status ? "–" : "?"} ${t.type ?? ""}${t.weight ? " · " + t.weight : ""}`));
      const hasKids = links.some(l => l.kind === "part-of" && l.to.toUpperCase() === id);
      if (hasKids) {
        const tg = svg("text", { x: width - 16, y: 16, class: "toggle" }, collapsed.has(id) ? "+" : "−");
        tg.addEventListener("click", ev => { ev.stopPropagation(); collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id); render(); });
        g.append(tg);
      }
      g.append(svg("title", {}, `${t.id ?? id}: ${t.summary ?? ""}`));
      const go = () => { focus = t.id ?? id; $("focus").value = focus; render(); };
      g.addEventListener("click", go);
      g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } });
      s.append(g);
    }
    const canvas = el("div", "canvas"); canvas.append(s);
    const legend = el("div", "legend muted", "Edges: requires → solid arrow · part-of = thick tree line (parent above) · related = dashed · other kinds dotted. Border colour = repo; size = graph weight; dashed box = closed.");
    const list = el("ul"); list.className = "muted";
    for (const e of edges) list.append(el("li", "", `${caption(nodeOf(e.from)) || e.from} ${e.kind} ${caption(nodeOf(e.to)) || e.to}`));
    const left = el("div"); left.style.flex = "1 1 520px"; left.style.minWidth = "0"; left.append(canvas, legend, list);
    wrap.append(left, info());
    return wrap;
  };

  const render = () => $("out").replaceChildren(tab === "tickets" ? tickets() : tab === "stories" ? stories() : graph());

  for (const b of document.querySelectorAll(".tabs button"))
    b.addEventListener("click", () => {
      tab = b.dataset.tab;
      for (const o of document.querySelectorAll(".tabs button")) o.setAttribute("aria-pressed", String(o === b));
      $("graphbar").hidden = tab !== "graph";
      $("q").hidden = tab === "graph";
      setFilters(); render();
    });
  for (const id of ["repo", "status", "type", "hops", "kind"]) $(id).addEventListener("change", render);
  $("focus").addEventListener("change", () => { const v = $("focus").value.trim(); if (byId.has(v.toUpperCase())) { focus = byId.get(v.toUpperCase()).id; render(); } });
  $("q").addEventListener("input", render);
  $("reload").addEventListener("click", () => location.reload());
  setFilters();
  $("status").value = "open";
  render();
})();
</script>
</body>
</html>
