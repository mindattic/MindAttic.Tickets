<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tickets</title>
<!-- Generated by `tickets view` (MindAttic.Tickets). A read-only snapshot: the tickets CLI is the only writer. -->
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
    --accent: #2f5fd0; --open: #b25e00; --closed: #2e7d32; --wont: #8a8a85; --row: #fafaf8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --panel: #1f1f1e; --text: #e8e8e4; --muted: #9a9a94; --line: #33332f;
      --accent: #7aa2ff; --open: #f0a64a; --closed: #6cc070; --wont: #7d7d78; --row: #232322;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  h1 { font-size: 16px; margin: 0 12px 0 0; }
  .muted { color: var(--muted); }
  select, input, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  input[type=search] { flex: 1 1 220px; min-width: 0; }
  button { cursor: pointer; }
  .tabs button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 12px 16px 40px; }
  .counts { margin: 4px 0 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; vertical-align: top; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  tr:nth-child(even) td { background: var(--row); }
  td.id, td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .s-open { color: var(--open); font-weight: 600; }
  .s-closed { color: var(--closed); }
  .s-wont-do { color: var(--wont); }
  .ref, .evidence { color: var(--muted); font-size: 12px; margin-top: 2px; }
  h2 { font-size: 14px; margin: 18px 0 6px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 640px) { td.date, th.date, td.type, th.type { display: none; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Tickets</h1>
    <span class="tabs">
      <button type="button" data-tab="tickets" aria-pressed="true">Tickets</button>
      <button type="button" data-tab="stories" aria-pressed="false">Stories</button>
    </span>
    <select id="repo" aria-label="Repo"><option value="">All repos</option></select>
    <select id="status" aria-label="Status"></select>
    <select id="type" aria-label="Type"></select>
    <input id="q" type="search" placeholder="Filter text, ID or ref" aria-label="Filter">
    <button type="button" id="reload" title="Re-read the snapshot (run 'tickets view' to refresh it)">Reload</button>
  </div>
  <div class="muted" id="generated"></div>
</header>
<main>
  <div class="counts muted" id="counts"></div>
  <div id="out"></div>
</main>
<script src="data.js"></script>
<script>
(() => {
  const data = window.TICKETS;
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  if (!data) { $("out").append(el("div", "empty", "No data.js next to this page; run 'tickets view'.")); return; }

  let tab = "tickets";
  $("generated").textContent = `Snapshot of the ticket database, ${data.generated}. Read-only: change tickets and stories with the tickets CLI.`;
  for (const r of data.repos) $("repo").append(new Option(`${r.name} (${r.code})`, r.name));
  if (data.selectedRepo) $("repo").value = data.repos.find(r => r.name.toLowerCase() === data.selectedRepo.toLowerCase())?.name ?? "";

  const options = (select, values) => {
    const keep = select.value;
    select.replaceChildren(...values.map(([v, label]) => new Option(label, v)));
    select.value = values.some(([v]) => v === keep) ? keep : values[0][0];
  };
  const setFilters = () => {
    if (tab === "tickets") {
      options($("status"), [["", "Any status"], ["open", "Open"], ["closed", "Closed"], ["wont-do", "Won't do"]]);
      options($("type"), [["", "Any type"], ...["feature", "fix", "chore", "docs", "interview"].map(t => [t, t])]);
      $("type").hidden = false;
    } else {
      options($("status"), [["", "Any status"], ["done", "✅ Done"], ["partial", "🟡 Partial"], ["planned", "⬜ Planned"]]);
      $("type").hidden = true;
    }
  };

  const matches = (item, fields) => {
    const q = $("q").value.trim().toLowerCase();
    return (!$("repo").value || item.repo === $("repo").value)
      && (!q || fields.some(f => (item[f] ?? "").toLowerCase().includes(q)));
  };

  const table = (heads, rows) => {
    if (rows.length === 0) return el("div", "empty", "Nothing matches.");
    const t = el("table"), head = el("tr");
    for (const [h, cls] of heads) head.append(el("th", cls, h));
    t.append(el("thead"), el("tbody"));
    t.tHead.append(head);
    t.tBodies[0].append(...rows);
    return t;
  };

  const tickets = () => {
    const status = $("status").value, type = $("type").value;
    const order = { open: 0, closed: 1, "wont-do": 2 };
    const list = data.tickets
      .filter(t => (!status || t.status === status) && (!type || t.type === type) && matches(t, ["id", "summary", "ref"]))
      .sort((a, b) => (order[a.status] ?? 3) - (order[b.status] ?? 3) || b.date.localeCompare(a.date) || a.id.localeCompare(b.id, undefined, { numeric: true }));
    const open = list.filter(t => t.status === "open").length;
    $("counts").textContent = `${list.length} ticket${list.length === 1 ? "" : "s"}, ${open} open`;
    return table([["ID", "id"], ["Date", "date"], ["Type", "type"], ["Status", ""], ["Summary", ""]], list.map(t => {
      const tr = el("tr"), summary = el("td", "", t.summary);
      if (t.ref && t.ref !== "—") summary.append(el("div", "ref", t.ref));
      tr.append(el("td", "id", t.id), el("td", "date", t.date), el("td", "type", t.type), el("td", "s-" + t.status, t.status), summary);
      return tr;
    }));
  };

  const stories = () => {
    const status = $("status").value;
    const list = data.stories.filter(s => s.status && (!status || s.status === status) && matches(s, ["id", "text", "evidence", "epic"]));
    const glyphs = { done: "✅", partial: "🟡", planned: "⬜" };
    const count = k => list.filter(s => s.status === k).length;
    $("counts").textContent = `${list.length} stor${list.length === 1 ? "y" : "ies"}: ${count("done")} ✅ · ${count("partial")} 🟡 · ${count("planned")} ⬜`;
    if (list.length === 0) return el("div", "empty", "Nothing matches.");
    const out = document.createDocumentFragment();
    const groups = new Map();
    for (const s of list) {
      const key = `${s.repo} — ${s.epic ?? "Stories"}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(s);
    }
    for (const [key, items] of groups) {
      out.append(el("h2", "", key), table([["ID", "id"], ["", ""], ["Story", ""]], items.map(s => {
        const tr = el("tr"), text = el("td", "", s.text);
        if (s.evidence) text.append(el("div", "evidence", s.evidence));
        tr.append(el("td", "id", s.id), el("td", "", s.glyph ?? glyphs[s.status] ?? ""), text);
        return tr;
      })));
    }
    return out;
  };

  const render = () => $("out").replaceChildren(tab === "tickets" ? tickets() : stories());

  for (const b of document.querySelectorAll(".tabs button"))
    b.addEventListener("click", () => {
      tab = b.dataset.tab;
      for (const o of document.querySelectorAll(".tabs button")) o.setAttribute("aria-pressed", String(o === b));
      setFilters(); render();
    });
  for (const id of ["repo", "status", "type"]) $(id).addEventListener("change", render);
  $("q").addEventListener("input", render);
  $("reload").addEventListener("click", () => location.reload());
  setFilters();
  $("status").value = "open";
  render();
})();
</script>
</body>
</html>
